<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tellbuster test: Gmail-style compose and a plain text box</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; }
  #body { width: 560px; max-width: 100%; min-height: 160px; border: 1px solid #999; padding: 8px; margin-bottom: 24px; }
  textarea { width: 560px; max-width: 100%; }
</style>
</head>
<body>
<h1>Gmail-style compose</h1>
<div id="body" contenteditable="true" role="textbox" aria-label="Message Body"><div><br></div></div>
<h2>Plain text box</h2>
<textarea id="ta" rows="5"></textarea>
</body>
</html>
